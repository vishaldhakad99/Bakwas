    <title>BAKWAS | Real-Time Messaging & Calling</title>
    <script type="module" crossorigin src="/assets/index-0DtJt0gQ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Cj1Q_MLF.css">
  </head>
  <body class="bg-bakwas-dark text-slate-100 overflow-hidden select-none antialiased">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    window.location.reload();
                  }
                };
              }
            };
          }).catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
